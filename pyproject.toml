[project]
name = "scmap"
version = "0.1.0"
description = "Cross-cohort cell-type annotation and novelty detection in colorectal cancer scRNA-seq with deep generative models"
readme = "README.md"
authors = [
    { name = "Matin Gerami", email = "mmatin.gerami@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.13.4",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scanpy>=1.12.4",
    "scib-metrics>=0.6.1",
    "scikit-learn>=1.9.1",
    "scvi-tools>=1.5.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
