# Experiment configuration. Paths are relative to the repository root.
seed: 0

paths:
  raw: data/raw
  processed: data/processed
  results: results
  models: results/models

data:
  reference: smc        # Lee et al. 2020, Samsung Medical Center (Korea), 23 patients
  query: kul3           # Lee et al. 2020, KU Leuven (Belgium), 6 patients
  min_genes: 200
  n_hvg: 3000

labels:
  coarse: cell_type
  fine: cell_subtype
  unlabeled: Unknown

scvi:
  n_latent: 30
  n_layers: 2
  n_hidden: 128
  dropout_rate: 0.1
  max_epochs: 200
  early_stopping: true
  batch_size: 512

scanvi:
  max_epochs: 40
  n_samples_per_label: 100

query:
  max_epochs: 100
  weight_decay: 0.0

baselines:
  logreg_C: 0.1
  knn_k: 15
  n_pcs: 50

open_set:
  # held out one at a time from the reference; chosen to span easy (distinct lineage)
  # and hard (close relative present in the reference) cases
  held_out:
    - Mast cells
    - Enteric glial cells
    - Goblet cells
    - Tip-like ECs
    - gamma delta T cells
    - Regulatory T cells
  # shorter schedule than the main run (six full retrainings); reported in the README
  max_epochs_scvi: 100
  max_epochs_scanvi: 20
  max_epochs_query: 50

evaluation:
  n_boot: 2000
